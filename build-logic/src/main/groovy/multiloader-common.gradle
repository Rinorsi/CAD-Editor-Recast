plugins { id 'java-library' }
group = "${project.group}.${project.parent.name}"
base.archivesName = "cadeditor-${project.parent.name}-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
layout.buildDirectory.set(rootProject.file('../Oriel-UI-Workspace/daily/' + java.time.LocalDate.now() + '/scratch/editor-mod/build/' + project.parent.name + '-' + minecraft_version))
repositories { mavenCentral() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def properties = [version: project.version, modrinth_id: providers.gradleProperty('modrinth_id').getOrElse(''), curseforge_id: providers.gradleProperty('curseforge_id').getOrElse(''), minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        fabric_minecraft_version: fabric_minecraft_version, fabric_loader_version: fabric_loader_version,
        neoforge_version: neoforge_version, neoforge_loader_version_range: neoforge_loader_version_range]
    inputs.properties(properties)
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand(properties) }
}
tasks.named('jar') { from(rootProject.file('NOTICE')) }
