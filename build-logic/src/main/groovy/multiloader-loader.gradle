plugins { id 'multiloader-common'; id 'multiloader-publish' }
configurations {
    commonJava { canBeResolved = true; canBeConsumed = false }
    commonResources { canBeResolved = true; canBeConsumed = false }
}
dependencies {
    commonJava(project(path: ":common:${project.name}", configuration: 'commonJava'))
    commonResources(project(path: ":common:${project.name}", configuration: 'commonResources'))
    implementation("dev.oriel:oriel-${project.parent.name}-${minecraft_version}:${oriel_version}") { transitive = false }
}
configurations { orielArtifact { canBeResolved = true; canBeConsumed = false; transitive = false } }
dependencies { orielArtifact("dev.oriel:oriel-${project.parent.name}-${minecraft_version}:${oriel_version}") }
tasks.named('compileJava', JavaCompile) {
    source(configurations.commonJava)
    // Shared Stonecutter sources are compiled into each loader, outside its sourceSet.
    // Incremental javac can drop unchanged shared classes after another target generates them.
    // Compile this small combined tree together so cross-target builds have complete symbols.
    options.incremental = false
}
processResources { from(configurations.commonResources) }
