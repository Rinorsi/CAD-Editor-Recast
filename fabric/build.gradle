// Live-Codec schema snapshot drift gate; never regenerate snapshots implicitly.
tasks.register('componentSchemaTest', JavaExec) {
    dependsOn codecVerificationClasses
    classpath = sourceSets.codecVerification.runtimeClasspath
    mainClass = 'dev.rinorsi.editor.registry.ComponentSchemaTest'
    workingDir = rootProject.projectDir
}
tasks.named('check') { dependsOn('componentSchemaTest') }

// World/editor schema checks use real factories in a non-ticking JVM level.
['entitySchemaTest': true, 'entitySchemaServerTest': false].each { taskName, clientSide ->
    tasks.register(taskName, JavaExec) {
        dependsOn codecVerificationClasses
        classpath = sourceSets.codecVerification.runtimeClasspath
        mainClass = 'dev.rinorsi.editor.registry.EntitySchemaTest'
        workingDir = rootProject.projectDir
        jvmArgs '-Djava.awt.headless=true', '-Dcadeditor.schema.client=' + clientSide
        args rootProject.file('logs/final-gate/entity-schema-' + (clientSide ? 'client' : 'server') + '.json').absolutePath
        doFirst { rootProject.file('logs/final-gate').mkdirs() }
    }
    tasks.named('check') { dependsOn(taskName) }
}
