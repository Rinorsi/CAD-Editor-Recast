    classpath = sourceSets.codecVerification.runtimeClasspath
    mainClass = 'dev.rinorsi.editor.registry.LazyCatalogTest'
    args rootProject.file('fabric/src/main/resources/assets/cadeditor/ui/js/pinyin-data.js').absolutePath
