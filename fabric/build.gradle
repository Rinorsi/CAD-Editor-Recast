plugins { id 'multiloader-loader' }
apply plugin: 'net.fabricmc.fabric-loom'
def daily = rootProject.file('../Oriel-UI-Workspace/daily/' + java.time.LocalDate.now())
def clientRun = new File(daily, project.name == '26.1' ? 'run/editor-mod-client' : "run/editor-fabric-${minecraft_version}-client")
repositories {
    mavenCentral()
    maven {
        url = 'https://maven.coolerpromc.com/releases/'
        content { includeGroup('com.coolerpromc.mctest') }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Development only: agent/MCP client control; never include or publish this dependency.
    if (project.name == '26.1' && providers.gradleProperty('mcTest').orNull != 'false') {
        localRuntime('com.coolerpromc.mctest:mctest-fabric-26.1.2:26.1.2.1') { transitive = false }
    }
}
loom {
    mods { editor { sourceSet(sourceSets.main) } }
    accessWidenerPath.set(stonecutter.process(rootProject.file('common/src/main/resources/cadeditor.accesswidener'), 'build/stonecutter-processed/cadeditor.accesswidener'))
    runs {
        client {
            runDirectory.set(clientRun.absolutePath)
            vmArg('-Doriel.sourceRoot=' + rootProject.file('common').absolutePath)
            if (providers.gradleProperty('mcTestPort').isPresent()) {
                vmArg('-Dmctest.port=' + providers.gradleProperty('mcTestPort').get())
            }
            if (providers.gradleProperty('editorLauncherDebug').orNull == 'true') {
                vmArg('-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5007')
            }
        }
        server { runDirectory.set(new File(daily, 'run/editor-mod-server').absolutePath); programArg('--nogui') }
    }
}

// Keep the exact release jar in the standalone Editor run directory too.
tasks.register('prepareEditorClient', Copy) {
    from(rootProject.file("libs/oriel-fabric-${minecraft_version}-${oriel_version}.jar"))
    into(new File(clientRun, 'mods'))
}
tasks.named('runClient') { dependsOn('prepareEditorClient') }
// Loom shares localRuntime with server runs; keep MCTest strictly client-only here.
tasks.named('runServer') {
    classpath = classpath.filter { it.name != 'mctest-fabric-26.1.2-26.1.2.1.jar' }
}
tasks.register('isolateEditorClient') {
    doLast {
        def modsDir = new File(clientRun, 'mods')
        modsDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { candidate ->
            def archive = new java.util.zip.ZipFile(candidate)
            def id
            try {
                def meta = archive.getEntry('fabric.mod.json')
                if (meta != null) id = new groovy.json.JsonSlurper().parse(archive.getInputStream(meta)).id
            } finally { archive.close() }
            if (id in ['editor_backend_probe', 'editor'] || (id == 'oriel' && candidate.name != "oriel-fabric-${minecraft_version}-${oriel_version}.jar")
                    || (id == 'cadeditor_final_gate_probe' && !providers.gradleProperty('finalGateWorld').isPresent())) {
                def quarantine = new File(daily, 'scratch/editor-mod/launcher-quarantine/' + candidate.name)
                quarantine.parentFile.mkdirs()
                java.nio.file.Files.move(candidate.toPath(), quarantine.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle('Isolated stale development mod from normal client: ' + candidate.name)
            }
        }
        assert !sourceSets.main.runtimeClasspath.files.any { it.path.contains('autotest') || it.path.contains('codecVerification') }
    }
}
tasks.named('runClient') { dependsOn('isolateEditorClient') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.named('jar') { from(rootProject.file('NOTICE')) }
// UI integration stays gated on the current Oriel review. No browser fixtures enter the jar.
if (providers.gradleProperty('editorUiApproved').orNull == 'true') {
    throw new GradleException('Use the documented Oriel integration workflow after user review; a build flag cannot approve UI.')
}

apply from: rootProject.file('gradle/verification.gradle')
if (project.name == '26.1') apply from: rootProject.file('gradle/fabric-autotest.gradle')

apply from: rootProject.file('gradle/smoke.gradle')
