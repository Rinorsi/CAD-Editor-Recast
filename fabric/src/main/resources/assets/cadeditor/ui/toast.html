<!doctype html>
<html lang="zh-CN" data-theme="dark" data-style="ore"><head><meta charset="utf-8"><title>物品工坊提示</title>
<link rel="stylesheet" href="oriel:ui/ore.css"><link rel="stylesheet" href="editor.css">
<style>
html, body { margin: 0; height: 100%; background: transparent; }
#stage { position: fixed; left: 0; right: 0; top: 18px; display: flex; justify-content: center; pointer-events: none; }
.k-toast.big { display: flex; align-items: flex-start; gap: 8px; max-width: 70%; padding: 6px 12px 7px; animation: m-modal-in 200ms var(--m-out) both; }
.k-toast.big.error { animation: m-modal-in 200ms var(--m-out) both, fx-shake 260ms linear 200ms; }
.k-toast.big.out { opacity: 0; transition: opacity 400ms; }
.k-toast.big .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.k-toast.big .tag { display: flex; align-items: center; gap: 6px; color: var(--tx2); }
.k-toast.big .tag b { color: var(--ico, var(--info)); }
.k-toast.big .msg { color: var(--tx); white-space: normal; word-break: break-all; }
</style></head>
<body><div id="stage"></div>
<script>
/* 物品工坊自己的提示（代替聊天栏里的系统消息）。Java 用 OrielHud 显示这页并推送 {text, level, title, seq}；
   level: info / ok / warn / error。几秒后自己关掉；新消息来了就换内容、重新计时。 */
(function () {
  var stage = document.getElementById('stage'), timer = null, gone = null, last = null;
  function h(tag, props, kids) {
    var el = document.createElement(tag); props = props || {};
    Object.keys(props).forEach(function (k) { if (k === 'text') el.textContent = props[k]; else if (props[k] != null) el.setAttribute(k, props[k]); });
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function ico(level) { var n = level === 'error' || level === 'warn' ? 'warning' : level === 'ok' ? 'check' : 'info'; var i = h('img', { class: 'o-ico', src: 'oriel:textures/icons/' + n + '.png', alt: '' }); i.style.width = '16px'; i.style.height = '16px'; return i; }
  function snd(id, vol, pitch) { try { if (oriel.playSound) oriel.playSound(id, vol, pitch); } catch (e) {} }
  function show(d) {
    if (!d || typeof d.text !== 'string' || !d.text) return;
    if (last !== null && d.seq !== undefined && d.seq === last) return;
    last = d.seq === undefined ? null : d.seq;
    var level = d.level === 'ok' || d.level === 'warn' || d.level === 'error' ? d.level : 'info';
    clearTimeout(timer); clearTimeout(gone);
    while (stage.firstChild) stage.removeChild(stage.firstChild);
    var t = h('div', { class: 'k-toast big ' + level }, [ico(level), h('div', { class: 'tx' }, [h('div', { class: 'tag' }, [h('b', { text: d.title || '物品工坊' }), h('span', { text: level === 'error' ? '出错了' : level === 'warn' ? '注意' : level === 'ok' ? '完成' : '提示' })]), h('div', { class: 'msg', text: d.text })])]);
    stage.appendChild(t);
    if (level === 'error') snd('minecraft:block.note_block.bass', 0.6, 0.7); else if (level === 'ok') snd('minecraft:entity.experience_orb.pickup', 0.35, 1.3);
    var ms = Math.max(2600, Math.min(9000, 1800 + d.text.length * 90));
    timer = setTimeout(function () { t.classList.add('out'); gone = setTimeout(function () { try { oriel.close(); } catch (e) {} }, 450); }, ms);
  }
  show(typeof oriel !== 'undefined' ? oriel.data : null);
  if (typeof oriel !== 'undefined' && oriel.on) oriel.on('data', function (data, key) { show(key === undefined && data && data.text ? data : oriel.data); });
})();
</script></body></html>
