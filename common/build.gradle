plugins { id 'multiloader-common'; id 'net.neoforged.moddev' }
neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(stonecutter.process(parent.file('src/main/resources/META-INF/accesstransformer.cfg'), 'build/stonecutter-processed/accesstransformer.cfg'))
}
// mixinStubs：只在 Common 编译期用的 Mixin 注解替身，不导出给加载器工程、也不会打进包（加载器用真正的 Mixin 库）。
// Common 的普通类（SpriteCatalog、EditorSoundPreview、EditorKeyBindings）会引用 *Accessor 接口，所以接口要能在 Common 里编译。
sourceSets { testFixtures; smoke; mixinStubs }
dependencies {
    compileOnly("dev.oriel:oriel-fabric-${minecraft_version}:${oriel_version}") { transitive = false }
    compileOnly sourceSets.mixinStubs.output
}
// Shared verification sources are consumed and executed by each loader.
tasks.named('compileTestJava') { enabled = false }
// 真正的 Mixin 类由各加载器工程用自己的 Mixin 实现编译；Common 是只编译不打包的源码桥，不依赖加载器。
// *Accessor 接口留在 Common 里编译（见 mixinStubs）。
tasks.named('compileJava', JavaCompile) { exclude('dev/rinorsi/editor/mixin/**/*Mixin.java') }
tasks.named('test') { enabled = false }
configurations {
    commonSmoke { canBeResolved = false; canBeConsumed = true }
    commonSmokeResources { canBeResolved = false; canBeConsumed = true }
    commonTests { canBeResolved = false; canBeConsumed = true }
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}
artifacts {
    sourceSets.smoke.java.srcDirs.each { dir -> commonSmoke(dir) { builtBy(sourceSets.smoke.java.sourceDirectories) } }
    sourceSets.smoke.resources.srcDirs.each { dir -> commonSmokeResources(dir) { builtBy(sourceSets.smoke.resources.sourceDirectories) } }
    [sourceSets.test, sourceSets.testFixtures].each { set ->
        set.java.srcDirs.each { dir -> commonTests(dir) { builtBy(set.java.sourceDirectories) } }
    }
    sourceSets.main.java.srcDirs.each { dir -> commonJava(dir) { builtBy(sourceSets.main.java.sourceDirectories) } }
    sourceSets.main.resources.srcDirs.each { dir -> commonResources(dir) { builtBy(sourceSets.main.resources.sourceDirectories) } }
}
if (!stonecutter.current.isActive) tasks.named('createMinecraftArtifacts') { dependsOn('stonecutterGenerate') }
