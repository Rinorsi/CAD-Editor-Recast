// Same headless regression tasks on every loader/version. No probes ship in release jars.
def daily = rootProject.file('../Oriel-UI-Workspace/daily/' + java.time.LocalDate.now())
configurations { commonTests { canBeResolved = true; canBeConsumed = false } }
dependencies { commonTests(project(path: ':common:' + project.name, configuration: 'commonTests')) }
sourceSets {
    codecVerification {
        java.setSrcDirs([])
        java.exclude('dev/rinorsi/editor/probe/**')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('codecTest', JavaExec) {
    dependsOn codecVerificationClasses
    classpath = sourceSets.codecVerification.runtimeClasspath
    mainClass = 'dev.rinorsi.editor.StackCodecTest'
    workingDir = new File(daily, 'scratch/editor-mod')
}
tasks.named('check') { dependsOn('codecTest') }
tasks.register('prefsTest', JavaExec) {
    dependsOn codecVerificationClasses
    classpath = sourceSets.codecVerification.runtimeClasspath
    mainClass = 'dev.rinorsi.editor.client.EditorPrefsTest'
    workingDir = new File(daily, 'scratch/editor-mod')
}
tasks.named('check') { dependsOn('prefsTest') }

tasks.register('clipboardTest', JavaExec) {
