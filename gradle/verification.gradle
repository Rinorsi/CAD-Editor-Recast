tasks.named('compileTestJava') { enabled = false }
tasks.named('test') { enabled = false }
tasks.named('compileCodecVerificationJava', JavaCompile) {
    source(configurations.commonTests)
    if (project.parent.name == 'fabric' && project.name == '26.1') source(sourceSets.test.java)
}
tasks.register('codecVerification') { group = 'verification'; dependsOn('check') }

// Source wiring assertions must inspect the same version that was compiled.
tasks.withType(JavaExec).configureEach {
    if (name == 'editDispatchTest') doFirst {
        systemProperty 'editor.sourceJava', configurations.commonJava.files.find { new File(it, 'dev/rinorsi/editor/client/EditorClient.java').exists() }.absolutePath
    }
}
