gradle.projectsEvaluated {
    def p = gradle.rootProject.findProject(':fabric:26.1')
    if (p == null) return // Init scripts also run for included build-logic builds.
    p.tasks.register('backendDataTest', JavaExec) {
        dependsOn p.tasks.named('codecVerificationClasses')
        classpath = p.sourceSets.codecVerification.runtimeClasspath
        mainClass = 'dev.rinorsi.editor.BackendDataTest'
        args gradle.rootProject.file('logs/backend-b').absolutePath
    }
}
