        'dev.rinorsi.editor.client.EditorClipboardTest',
        'dev.rinorsi.editor.registry.SpawnerApplyTest',
        'dev.rinorsi.editor.registry.FrontendWiringTest',
        'dev.rinorsi.editor.registry.ResourceIdsTest',
        'dev.rinorsi.editor.registry.EntityDataTest',
        'dev.rinorsi.editor.registry.EntitySchemaTest',
        'dev.rinorsi.editor.registry.RegistryStressTest',
        'dev.rinorsi.editor.registry.DraftUtf8CounterTest',
        'dev.rinorsi.editor.registry.RegistryPagesTest',
        'dev.rinorsi.editor.registry.RegistryDeliveryTest'
    ]
    def tests = names.collect { name ->
        p.tasks.register('integration' + name.tokenize('.').last(), JavaExec) {
            dependsOn p.tasks.named('codecVerificationClasses')
